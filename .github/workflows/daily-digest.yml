name: Daily Email Digest

# Runs the fetch -> summarize -> send pipeline on a schedule.
#
# IMPORTANT — cron is in UTC. GitHub Actions does not observe daylight saving
# time, so a fixed UTC time drifts by ±1 hour in your local clock across DST
# changes. Pick the UTC time that matches the local time you want, and adjust it
# twice a year if you need it pinned. Example: 07:00 UTC = 08:00 CET / 09:00
# CEST. You can also trigger it by hand any time via "Run workflow" below.
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily — EDIT to your preferred time
  workflow_dispatch:       # manual "Run workflow" button

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install: the scripts are standard library only.
      # Secrets are injected as environment variables; the scripts already
      # prefer real env vars over any .env file.
      - name: Fetch inbox
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          DIGEST_HOURS: ${{ vars.DIGEST_HOURS || '24' }}
        run: python fetch_inbox.py --hours "${DIGEST_HOURS}" > inbox.json

      - name: Summarize
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-haiku-4-5' }}
        run: python summarize.py inbox.json > digest.md

      - name: Send digest
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          DIGEST_TO: ${{ vars.DIGEST_TO }}
        run: python send_digest.py digest.md
